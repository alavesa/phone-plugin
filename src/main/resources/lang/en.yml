# Phone - English. Copy this file to <code>.yml, translate it, and set "language: <code>" in config.yml.
# Everything outside "ui:" is MiniMessage (https://docs.advntr.dev/minimessage/format.html); <name> are placeholders.
# The strings under "ui:" (except ui.title and ui.button.*) are drawn inside the phone screen: plain text only,
# no tags - the phone theme colours them, and the plugin measures them to align the screen.

# Bumped when texts change. An older file on the server is kept as en.yml.old-<version> and replaced by this one,
# so screens never mix old wording with new buttons. Copy your changes over from the backup.
version: 2

item:
  phone:
    name: "<white>Phone"
    lore: "<gray>Right-click to open"
  photo-paper:
    name: "<white>Photo Paper"
    lore: "<gray>Used when the phone prints a photo"
  photo:
    name: "<white>Photo by <player>"
    lore-by: "<gray>Photographer: <white><player>"
    lore-date: "<gray>Taken: <white><date>"
    lore-location: "<gray>Location: <white><world> <x>, <y>, <z>"
  video:
    name: "<white>Video by <player>"
    lore-length: "<gray>Length: <white><seconds> s <gray>- hold to watch"

pack:
  failed: "<red>The phone resource pack could not be downloaded.</red> <gray>Your phone works in plain text, without the camera effects. Try <white>/phone pack</white>; if you installed the pack yourself, use <white>/phone ui fancy</white>."
  declined: "<gray>You declined the phone resource pack: your phone works in plain text. <white>/phone pack</white> offers it again."

passcode:
  set: "<green>Passcode set. You need it every time you open your phone."

error:
  not-ready: "<gray>Your phone is starting up, try again in a moment."
  no-permission: "<red>You are not allowed to do that."
  no-phone: "<red>You need a phone for that."
  no-apps: "<red>Your phone has no apps you are allowed to use."

message:
  hint: "<aqua>New message from <white><player></white> - open your phone"
  waiting: "<aqua>You have <white><count></white> unread message(s) on your phone"

camera:
  not-allowed: "<red>You cannot use the camera."
  hold-phone: "<red>Hold the phone in your hand to use the camera."
  # <lens> is lens-rear or lens-front below
  actionbar: "<white><lens> <yellow><zoom>x</yellow> <dark_gray>|</dark_gray> <gray>Right: photo <dark_gray>|</dark_gray> Left: flip <dark_gray>|</dark_gray> F: video <dark_gray>|</dark_gray> Scroll: zoom <dark_gray>|</dark_gray> Sneak: close"
  actionbar-no-video: "<white><lens> <yellow><zoom>x</yellow> <dark_gray>|</dark_gray> <gray>Right: photo <dark_gray>|</dark_gray> Left: flip <dark_gray>|</dark_gray> Scroll: zoom <dark_gray>|</dark_gray> Sneak: close"
  lens-rear: "Camera"
  lens-front: "<aqua>Selfie</aqua>"
  actionbar-preparing: "<yellow>Preparing the recording..."
  actionbar-recording: "<red>REC</red> <white><seconds> s</white> <gray>/ <max> s <dark_gray>|</dark_gray> F: stop"
  video-saved: "<green>Video saved. <gray>Hold it to watch."
  actionbar-capturing: "<yellow>Developing the photo..."
  cooldown: "<red>The camera is ready again in <seconds> s"
  failed: "<red>The photo could not be developed."
  nothing-to-print: "<red>There is no photo to print."
  no-paper: "<red>You need Photo Paper to print."
  inventory-full: "<red>Your inventory is full."
  printed: "<green>Photo printed."
  printed-dropped: "<green>Photo printed. <gray>Your inventory is full, so it dropped at your feet."

command:
  ui: "<gray>Phone look: <white><mode></white> -> <white><result></white>. Resource pack: <white><pack></white>. <gray>Change with /phone ui auto|fancy|plain"
  passcode-reset: "<green>The passcode of <player> was removed. They choose a new one the next time they open a phone."
  status: "<gray>Pack delivery: <white><delivery></white>, SHA-1 <white><sha1></white>. Video frames in memory: <white><frames></white>"
  players-only: "<red>Only a player can do that."
  reloaded: "<green>Phone configuration reloaded."
  gave-phone: "<green>Gave a phone to <player>."
  gave-paper: "<green>Gave <amount> photo paper to <player>."
  unknown-player: "<red>No player named <player> has been on this server."
  muted: "<green><player> can no longer send phone messages."
  muted-for: "<green><player> cannot send phone messages for <minutes> minute(s)."
  unmuted: "<green><player> can send phone messages again."
  blocked: "<green>You blocked <player>. Their messages no longer reach you."
  unblocked: "<green>You unblocked <player>."
  fov: "<green>Photos are now taken with a field of view of <fov>. <gray>Use the same value as in your video settings."
  no-pack: "<red>This server does not send the phone resource pack."

